version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: lucy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  lucy-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lucy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Optional frontend service. Start it with:
  #   docker compose --profile frontend up --build
  lucy-frontend:
    image: node:20-alpine
    container_name: lucy-frontend
    profiles: ["frontend"]
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install && npm run build && npx serve -s dist -l 3000"
    depends_on:
      - lucy-backend

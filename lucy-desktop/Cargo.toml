[package]
name = "lucy-desktop"
version = "0.1.0"
edition = "2024"
description = "Lucy Desktop — 100% Rust local management application"
authors = ["Lucy Team"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "persistence", "default_fonts"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
egui-phosphor = { version = "0.7", features = ["regular"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.41", features = ["rt", "rt-multi-thread", "macros", "sync"] }
poll-promise = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wix]
upgrade-guid = "43d83034-2dee-47f4-90c7-b917ddc8067f"

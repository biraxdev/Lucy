name: CI

on:
  push:
    branches: [main, master, v2]
  pull_request:
    branches: [main, master, v2]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt flake8==7.1.0
      - name: Run blocking backend regression tests
        run: cd backend && python -m pytest tests/test_auth.py tests/test_agents.py tests/test_library.py tests/test_metrics.py -v --tb=short
      - name: Run full backend suite (legacy baseline)
        continue-on-error: true
        run: cd backend && python -m pytest tests/ -v --tb=short
      - name: Lint backend
        run: flake8 backend --select=E9,F63,F7,F82 --exclude=backend/modules,backend/core/library/registry.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Lint frontend
        run: cd frontend && npm run lint
      - name: Build frontend
        run: cd frontend && npm run build

title: Kerberoasting Activity
description: |
  Detects requests for Kerberos service tickets with weak encryption types
  (e.g., RC4-HMAC) or events referencing known Kerberoasting tooling.
logsource:
  product: windows
  service: security
detection:
  selection_4769:
    EventID: 4769
    TicketOptions: '0x40810010'
    TicketEncryptionType:
      - '0x17'  # RC4-HMAC
      - '0x1'   # DES-CBC-CRC
      - '0x3'   # DES-CBC-MD5
  selection_tools:
    CommandLine|contains:
      - 'kerberoast'
      - 'tgsrepcrack'
      - 'rc4_hmac'
  condition: selection_4769 or selection_tools
falsepositives:
  - Legacy applications using RC4
level: high
tags:
  - attack.t1558.003
  - attack.credential_access

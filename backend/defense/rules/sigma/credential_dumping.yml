title: Credential Dumping - LSASS or SAM Access
description: |
  Detects attempts to dump credentials from LSASS memory or SAM/SECURITY
  registry hives, commonly associated with Mimikatz, sekurlsa, or similar tools.
logsource:
  product: windows
detection:
  selection_lsass:
    TargetImage|endswith: '\lsass.exe'
  selection_sam:
    ObjectName|contains:
      - '\SAM'
      - '\SECURITY'
  selection_tools:
    CommandLine|contains:
      - 'sekurlsa'
      - 'mimikatz'
      - 'DumpCreds'
      - 'lsadump'
  condition: selection_lsass or selection_sam or selection_tools
falsepositives:
  - Legitimate backup or forensics tools with explicit authorization
level: critical
tags:
  - attack.t1003
  - attack.credential_access

title: Lateral Movement via SMB or PSExec
description: |
  Detects execution of tools such as PSExec, RemCom, or service control
  commands targeting ADMIN$ or IPC$ shares, indicative of lateral movement.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'psexec'
      - 'remcom'
      - '\\ADMIN$'
      - '\\IPC$'
      - 'sc \\192.168.'
      - 'sc \\10.'
      - 'svcctl'
  condition: selection
falsepositives:
  - Authorized remote administration
level: high
tags:
  - attack.t1021.002
  - attack.lateral_movement
